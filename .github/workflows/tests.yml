name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          # jolt's own install script owns the archive and binary naming and
          # verifies the checksum.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Install clj-kondo
        run: |
          set -euo pipefail
          # clj-kondo's install script, as its doc/install.md gives it, pinned
          # to the version the lint was last clean on
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          mkdir -p "$HOME/.local/bin"
          ./install-clj-kondo --dir "$HOME/.local/bin" --version 2026.08.04
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
      - name: Lint
        run: clj-kondo --lint src test examples --fail-level warning
